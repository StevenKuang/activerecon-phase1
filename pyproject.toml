[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "activebench"
version = "0.1.0"
description = "Phase 1 active 3D reconstruction benchmark, reproducible evidence and Spark replay."
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = {text = "MIT"}
dependencies = ["numpy>=1.23", "PyYAML>=6.0", "scipy>=1.7", "Pillow>=9", "matplotlib>=3.6"]

[project.optional-dependencies]
dev = ["pytest>=7"]
viewer = []
share = ["viser>=1.0.26,<1.1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["activebench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
